name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Instalamos Flutter en el servidor de GitHub
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"

      # 2. Entramos en la carpeta, descargamos paquetes y compilamos
      - run: |
          cd mobile_app
          flutter pub get
          flutter build web --release

      # 3. Subimos el resultado a Firebase como canal de preview
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RUTEXGO_2DAMA }}
          projectId: rutexgo-2dama
          entryPoint: ./mobile_app
