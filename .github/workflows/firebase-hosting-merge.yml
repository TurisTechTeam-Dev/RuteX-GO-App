# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - web
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Instalamos Flutter en el servidor de GitHub
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 2. Entramos en la carpeta, descargamos paquetes y compilamos
      - run: |
          cd mobile_app
          flutter pub get
          flutter build web --release

      # 3. Subimos el resultado a Firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_RUTEXGO_2DAMA }}
          channelId: live
          projectId: rutexgo-2dama
          entryPoint: ./mobile_app  # Le decimos que busque la config dentro de la carpeta